name: Android (Vistoria)

# App nativo (Kotlin/Compose) em android/. Roda os testes e gera o APK de teste;
# com a chave de assinatura configurada, gera também APK e AAB de release.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verificar se há chave de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"; fi

      - name: Testes de unidade
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Gerar APK de teste (debug)
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vistoria-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: android/app/build/reports/tests/

      - name: Gerar APK e AAB assinados (se houver chave)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew assembleRelease bundleRelease --no-daemon
          rm -f keystore.properties

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        with:
          name: vistoria-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

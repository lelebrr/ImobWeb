name: Android (Vistoria)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Endereço do site em produção (ex.: https://seu-dominio.com.br)"
        required: false
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Defina a variável SERVER_URL em Settings > Secrets and variables > Actions > Variables
      CAP_SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL || 'https://imobweb2.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Verificar se há chave de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"; fi

      - name: Instalar dependências
        run: npm ci

      - name: Preparar app (offline.html + cap sync)
        run: npm run sync

      - name: Gerar APK de teste (debug)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vistoria-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Gerar APK e AAB assinados (se houver chave)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        with:
          name: vistoria-release
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

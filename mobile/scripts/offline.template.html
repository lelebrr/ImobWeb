<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vistoria imobWeb</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#0a0a0f;color:#f4f4f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:360px}
  .logo{width:84px;height:84px;margin:0 auto 20px;border-radius:22px;background:#0b5bd3;display:grid;place-items:center}
  h1{font-size:1.35rem;margin-bottom:10px}
  p{color:#a1a1aa;line-height:1.5;font-size:.95rem;margin-bottom:22px}
  button{border:0;border-radius:14px;padding:14px 22px;font-size:1rem;font-weight:600;background:#0b5bd3;color:#fff;width:100%}
  small{display:block;margin-top:16px;color:#71717a;font-size:.8rem}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 100 100"><polygon points="50,18 86,50 76,50 76,80 24,80 24,50 14,50" fill="#fff"/><polyline points="38,52 47,62 64,42" fill="none" stroke="#0b5bd3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Sem conexão com o servidor</h1>
  <p>Não foi possível abrir a Vistoria agora. Verifique o Wi-Fi ou os dados móveis e tente de novo. Vistorias já abertas neste aparelho continuam salvas.</p>
  <button type="button" onclick="retry()">Tentar novamente</button>
  <small id="s"></small>
</main>
<script>
  function retry(){ document.getElementById('s').textContent='Tentando...'; location.href = '__START_URL__'; }
  window.addEventListener('online', retry);
</script>
</body>
</html>
